name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install 'jupyterlab~=4.4.0'
      - name: Install JavaScript dependencies
        run: jlpm install --immutable
      - name: Check JavaScript formatting
        run: jlpm run eslint:check
      - name: Build and install the extension
        run: python -m pip install '.[tests]'
      - name: Run Python tests
        run: python -m pytest tests -q
      - name: Check extension registration
        run: jupyter labextension list 2>&1 | grep -ie '@bokeh/jupyter_bokeh.*OK'
      - name: Check JupyterLab in the browser
        run: python -m jupyterlab.browser_check
